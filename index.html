<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OSINT TERROR MAP</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    /* Header */
    .title {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 26px;
      border-radius: 14px;
      background: rgba(30,30,30,0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #e9eef5;
      font: 700 34px/1.1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
      user-select: none;
    }

    /* Left debug panel */
    .panel {
      position: absolute;
      top: 92px;
      left: 16px;
      width: 320px;
      z-index: 1000;
      padding: 14px 14px;
      border-radius: 14px;
      background: rgba(30,30,30,0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #e9eef5;
      font: 600 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
    }
    .panel h3{
      margin: 0 0 8px 0;
      font-size: 16px;
      letter-spacing: 1px;
      opacity: .95;
    }
    .muted { opacity: .9; font-weight: 500; }
    .ok { color: #7CFFB2; }
    .bad { color: #FF7C7C; }

    /* Bottom slider */
    .sliderWrap {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(30,30,30,0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #e9eef5;
      font: 700 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
      min-width: 360px;
    }
    .sliderWrap input[type="range"]{
      width: 260px;
    }
    .yearBadge{
      min-width: 54px;
      text-align: right;
      font-weight: 800;
      opacity: .95;
    }

    /* Popup */
    .popupTitle{ font-weight: 800; margin-bottom: 6px; }
    .popupMeta{ font-size: 12px; opacity: .9; }
    .popupMeta b{ opacity: 1; }
    .popupLink a{ text-decoration: none; }
  </style>
</head>
<body>
  <div class="title">OSINT TERROR MAP</div>

  <div class="panel" id="debug">
    <h3>DEBUG STATUS</h3>
    <div class="muted">Betöltés...</div>
  </div>

  <div class="sliderWrap" id="sliderWrap" style="display:none;">
    <div>Year:</div>
    <input id="year" type="range" min="2025" max="2026" step="1" value="2025" />
    <div class="yearBadge" id="yearLabel">2025</div>
  </div>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const debugEl = document.getElementById("debug");
    const sliderWrap = document.getElementById("sliderWrap");
    const yearInput = document.getElementById("year");
    const yearLabel = document.getElementById("yearLabel");

    const map = L.map("map", { zoomControl: true }).setView([20, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const cluster = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 60
    });
    map.addLayer(cluster);

    let all = [];
    let currentYear = parseInt(yearInput.value, 10);

    function safeText(s){
      return (s ?? "").toString().replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    }

    function formatDate(iso){
      if(!iso) return "unknown";
      // ISO: 2025-02-05T12:34:56Z or 2025-02-05
      return iso.substring(0, 10);
    }

    function renderDebug(extra){
      const years = all.map(x => x.year).filter(Boolean);
      const minY = years.length ? Math.min(...years) : "—";
      const maxY = years.length ? Math.max(...years) : "—";

      const visible = all.filter(x => x.year === currentYear);
      const withCoords = visible.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lon));

      debugEl.innerHTML = `
        <h3>DEBUG STATUS</h3>
        <div>Year filter: <b>${currentYear}</b></div>
        <div>JSON load: <b class="${all.length ? 'ok' : 'bad'}">${all.length ? 'OK' : 'ERROR'}</b></div>
        <div>Total records: <b>${all.length}</b></div>
        <div>Visible (year-matched): <b>${visible.length}</b></div>
        <div>With coordinates: <b>${withCoords.length}</b></div>
        <div>Year span: <b>${minY}</b> – <b>${maxY}</b></div>
        <div class="muted" style="margin-top:8px;">
          Source: <b>GDELT (DOC API)</b><br/>
          Mode: <b>clustered + year slider</b>
        </div>
        ${extra ? `<div class="muted" style="margin-top:8px;">${safeText(extra)}</div>` : ""}
      `;
    }

    function rebuild(){
      yearLabel.textContent = currentYear;
      cluster.clearLayers();

      const visible = all.filter(x => x.year === currentYear && Number.isFinite(x.lat) && Number.isFinite(x.lon));
      for(const ev of visible){
        const title = ev.title || ev.location || "Unnamed event";
        const date = formatDate(ev.date);
        const src = ev.source || "unknown";
        const url = ev.url || "";

        const popup = `
          <div class="popupTitle">${safeText(title)}</div>
          <div class="popupMeta"><b>Date:</b> ${safeText(date)}</div>
          <div class="popupMeta"><b>Location:</b> ${safeText(ev.location || "unknown")}</div>
          <div class="popupMeta"><b>Source:</b> ${safeText(src)}</div>
          ${url ? `<div class="popupLink" style="margin-top:8px;"><a href="${safeText(url)}" target="_blank" rel="noopener">Open source</a></div>` : ""}
        `;

        const m = L.circleMarker([ev.lat, ev.lon], {
          radius: 6,
          weight: 1,
          fillOpacity: 0.75
        }).bindPopup(popup, { maxWidth: 360 });

        cluster.addLayer(m);
      }

      renderDebug();
    }

    async function load(){
      try{
        const res = await fetch("./incidents.json", { cache: "no-store" });
        const text = await res.text();
        const data = JSON.parse(text);

        // Normalize
        all = (Array.isArray(data) ? data : []).map(x => ({
          title: x.title ?? "",
          date: x.date ?? "",
          year: Number(x.year) || (x.date ? Number(String(x.date).slice(0,4)) : null),
          lat: Number(x.lat),
          lon: Number(x.lon),
          location: x.location ?? "",
          source: x.source ?? "",
          url: x.url ?? ""
        })).filter(x => Number.isFinite(x.year));

        // slider year bounds
        const years = [...new Set(all.map(x => x.year))].sort((a,b)=>a-b);
        if(years.length){
          yearInput.min = String(years[0]);
          yearInput.max = String(years[years.length - 1]);
          if(currentYear < years[0] || currentYear > years[years.length - 1]){
            currentYear = years[0];
            yearInput.value = String(currentYear);
          }
          sliderWrap.style.display = "flex";
        } else {
          sliderWrap.style.display = "none";
        }

        renderDebug();
        rebuild();
      } catch(e){
        all = [];
        renderDebug("Load error: " + (e?.message || String(e)));
      }
    }

    yearInput.addEventListener("input", () => {
      currentYear = parseInt(yearInput.value, 10);
      rebuild();
    });

    load();
  </script>
</body>
</html>
