<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSINT Terror Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{height:100%;margin:0;background:#0b0f14;font-family:Arial}
#map{height:100vh}

.title{
position:fixed;z-index:9999;top:18px;left:50%;
transform:translateX(-50%);
color:#e6edf3;font-size:26px;font-weight:700;
letter-spacing:4px;background:rgba(0,0,0,0.55);
padding:10px 16px;border-radius:10px;
border:1px solid rgba(255,255,255,0.10);
}

.panel{
position:fixed;z-index:9999;top:78px;left:18px;
width:280px;color:#e6edf3;
background:rgba(0,0,0,0.55);
padding:14px 16px;border-radius:12px;
border:1px solid rgba(255,255,255,0.10);
font-size:13px;line-height:1.4;
}

.sliderBox{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
z-index:9999;
background:rgba(0,0,0,0.6);
padding:12px 18px;
border-radius:12px;
color:white;
border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<div class="title">OSINT TERROR MAP</div>

<div class="panel">
<b>TIME ANALYSIS</b><br>
Use slider to filter events
</div>

<div id="map"></div>

<div class="sliderBox">
Year:
<input type="range" min="2025" max="2026" value="2025" id="yearSlider">
<span id="yearLabel">2025</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([30,20],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

let markers=[];

function loadData(year){
markers.forEach(m=>map.removeLayer(m));
markers=[];

fetch("incidents.json")
.then(r=>r.json())
.then(data=>{
data.forEach(ev=>{

if(!ev.date || ev.date.substring(0,4) < year) return;

var m=L.circleMarker([ev.lat,ev.lon],{
radius:7,
color:"red",
fillColor:"red",
fillOpacity:0.85
}).addTo(map);

m.bindPopup(
"<b>"+ev.title+"</b><br>"+
ev.location+"<br>"+
ev.date
);

markers.push(m);
});
});
}

loadData("2025");

document.getElementById("yearSlider").oninput=function(){
document.getElementById("yearLabel").innerText=this.value;
loadData(this.value);
}
</script>

</body>
</html>
