<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OSINT Terror Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{height:100%;margin:0;background:#0b0f14;font-family:Arial}
#map{height:100vh}

.title{
position:fixed;z-index:9999;top:18px;left:50%;
transform:translateX(-50%);
color:#e6edf3;font-size:28px;font-weight:700;
letter-spacing:4px;background:rgba(0,0,0,0.55);
padding:10px 16px;border-radius:10px;
border:1px solid rgba(255,255,255,0.10);
}

.panel{
position:fixed;z-index:9999;top:78px;left:18px;
width:260px;color:#e6edf3;
background:rgba(0,0,0,0.55);
padding:14px 16px;border-radius:12px;
border:1px solid rgba(255,255,255,0.10);
font-size:13px;line-height:1.4;
}
</style>
</head>
<body>

<div class="title">OSINT TERROR MAP</div>

<div class="panel">
<b>REALTIME MONITOR</b><br>
● Source: OSINT auto feed<br>
● Mode: LIVE<br>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([30,20],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

/* ===== LOAD INCIDENTS ===== */
fetch("incidents.json")
.then(r=>r.json())
.then(data=>{
data.forEach(ev=>{

let color="red";
if(ev.type==="shooting") color="orange";
if(ev.type==="bomb") color="yellow";

var m=L.circleMarker([ev.lat,ev.lon],{
radius:8,
color:color,
fillColor:color,
fillOpacity:0.9
}).addTo(map);

m.bindPopup(
"<b>"+ev.title+"</b><br>"+
ev.location+"<br>"+
ev.date+"<br>"+
"<a href='"+ev.source+"' target='_blank'>source</a>"
);

});
});
</script>

</body>
</html>
