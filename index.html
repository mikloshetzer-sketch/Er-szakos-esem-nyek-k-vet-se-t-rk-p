<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<title>OSINT Terror Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body { margin:0; padding:0; height:100%; background:#0e1114; }
#map { height:100%; width:100%; }

.header {
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.55);
  color:#e5e7eb;
  padding:14px 28px;
  border-radius:10px;
  font-size:26px;
  letter-spacing:2px;
  z-index:1000;
}

.debug {
  position:absolute;
  top:90px;
  left:20px;
  background:rgba(0,0,0,0.55);
  color:#d1d5db;
  padding:14px;
  border-radius:10px;
  font-size:13px;
  z-index:1000;
  width:260px;
}
</style>
</head>

<body>

<div class="header">OSINT TERROR MAP</div>
<div class="debug" id="debug">Loading…</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView([20, 0], 2);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

fetch("incidents.json")
  .then(r => r.json())
  .then(data => {

    document.getElementById("debug").innerHTML = `
      <b>DEBUG STATUS</b><br>
      Records: ${data.length}<br>
      Source: GDELT<br>
      Mode: named events
    `;

    data.forEach(e => {

      if (!e.lat || !e.lon) return;

      const popup = `
        <b>${e.title || "Security incident"}</b><br>
        <small>${e.date || "unknown date"}</small><br><br>
        <b>Location:</b> ${e.location || "unknown"}<br>
        <b>Source:</b> ${e.source || "unknown"}<br>
        ${e.url ? `<a href="${e.url}" target="_blank">Open source</a>` : ""}
      `;

      L.circleMarker([e.lat, e.lon], {
        radius:6,
        color:"#ef4444",
        fillOpacity:0.85
      }).addTo(map).bindPopup(popup);

    });

  })
  .catch(err => {
    document.getElementById("debug").innerHTML =
      "ERROR loading incidents.json";
    console.error(err);
  });
</script>

</body>
</html>
