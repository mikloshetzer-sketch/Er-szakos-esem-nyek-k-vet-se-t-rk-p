<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>OSINT Terror Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    background:#0b0f14;
    color:white;
    font-family:Arial;
}
#map{
    height:100vh;
}
.title{
    position:absolute;
    z-index:999;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:32px;
    font-weight:bold;
    letter-spacing:3px;
}
</style>
</head>

<body>

<div class="title">OSINT TERROR MAP</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([30,20], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OSINT map'
}).addTo(map);
</script>

</body>
</html>
