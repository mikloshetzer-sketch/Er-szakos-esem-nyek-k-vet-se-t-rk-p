<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSINT Terror Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
html,body{height:100%;margin:0;background:#0b0f14;font-family:Arial}
#map{height:100vh}

.title{
position:fixed;z-index:9999;top:18px;left:50%;
transform:translateX(-50%);
color:#e6edf3;font-size:26px;font-weight:700;
letter-spacing:4px;background:rgba(0,0,0,0.55);
padding:10px 16px;border-radius:10px;
border:1px solid rgba(255,255,255,0.10);
}

.panel{
position:fixed;z-index:9999;top:78px;left:18px;
width:320px;color:#e6edf3;
background:rgba(0,0,0,0.55);
padding:14px 16px;border-radius:12px;
border:1px solid rgba(255,255,255,0.10);
font-size:13px;line-height:1.5;
}

.sliderBox{
position:fixed;bottom:20px;left:50%;
transform:translateX(-50%);
z-index:9999;background:rgba(0,0,0,0.6);
padding:12px 18px;border-radius:12px;color:white;
border:1px solid rgba(255,255,255,0.1);
}

.small{opacity:0.75;font-size:12px;margin-top:6px;white-space:pre-wrap}
.bad{color:#ff6b6b}
.good{color:#7CFC90}
</style>
</head>
<body>

<div class="title">OSINT TERROR MAP</div>

<div class="panel">
<b>DEBUG STATUS</b><br>
Year filter: <span id="yf">2025</span><br>
JSON load: <span id="jstat">pending</span><br>
Total records: <span id="tot">?</span><br>
Visible records: <span id="vis">?</span><br>
<div class="small" id="msg"></div>
</div>

<div id="map"></div>

<div class="sliderBox">
Year:
<input type="range" min="2025" max="2026" value="2025" id="yearSlider">
<span id="yearLabel">2025</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
var map = L.map('map').setView([30,20],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

let ALL = [];
let cluster = L.markerClusterGroup({
  disableClusteringAtZoom: 7,
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true
});
map.addLayer(cluster);

function setText(id, v){ document.getElementById(id).textContent = v; }
function setHTML(id, v){ document.getElementById(id).innerHTML = v; }

function colorFor(type){
  if(type==="bomb") return "yellow";
  if(type==="shooting") return "orange";
  if(type==="riot") return "violet";
  return "red";
}

function paint(year){
  cluster.clearLayers();
  let visible=0;

  ALL.forEach(ev=>{
    const d = (ev.date || "").toString();
    const y = d.substring(0,4);
    const lat = ev.lat;
    const lon = ev.lon;

    if(typeof lat !== "number" || typeof lon !== "number") return;
    if(y && y < year) return;

    const c = colorFor(ev.type);

    // circleMarker helyett sima marker + divIcon, hogy clusterelhető legyen
    const icon = L.divIcon({
      className: "",
      html: `<div style="
        width:12px;height:12px;border-radius:50%;
        background:${c};box-shadow:0 0 0 2px rgba(0,0,0,0.35);
      "></div>`,
      iconSize: [12,12],
      iconAnchor: [6,6]
    });

    const m = L.marker([lat,lon], {icon});

    m.bindPopup(
      "<b>"+(ev.title||"OSINT event")+"</b><br>"+
      (ev.location||"") +"<br>"+
      (ev.date||"") +"<br>"+
      (ev.source ? "<a href='"+ev.source+"' target='_blank'>source</a>" : "")
    );

    cluster.addLayer(m);
    visible++;
  });

  setText("vis", visible);
}

async function load(){
  try{
    const url = "incidents.json?v=" + Date.now(); // cache-bust
    const r = await fetch(url);
    if(!r.ok){
      setHTML("jstat", "<span class='bad'>HTTP "+r.status+"</span>");
      setText("msg", "Nem tudtam betölteni: "+url);
      return;
    }
    const data = await r.json();
    ALL = Array.isArray(data) ? data : [];
    setHTML("jstat", "<span class='good'>OK</span>");
    setText("tot", ALL.length);

    // diagnózis: egyedi koordináták száma
    const uniq = new Set();
    let okCoords = 0;
    for(const e of ALL){
      if(typeof e.lat==="number" && typeof e.lon==="number"){
        okCoords++;
        uniq.add(e.lat.toFixed(3)+","+e.lon.toFixed(3));
      }
    }
    setHTML("msg",
      "Koordinátás rekordok: "+okCoords+
      "\nEgyedi koordináták (~0.001°): "+uniq.size+
      "\nHa uniq=1, akkor minden pont egy helyre esik (ezért látszott 1 pötty)."
    );

    paint(document.getElementById("yearSlider").value);
  }catch(e){
    setHTML("jstat", "<span class='bad'>ERROR</span>");
    setText("msg", String(e));
  }
}

document.getElementById("yearSlider").oninput=function(){
  document.getElementById("yearLabel").innerText=this.value;
  document.getElementById("yf").innerText=this.value;
  paint(this.value);
};

load();
</script>

</body>
</html>
