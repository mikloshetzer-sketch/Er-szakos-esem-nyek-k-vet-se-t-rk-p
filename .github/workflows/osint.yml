name: OSINT Live Feed (GDELT)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build incidents.json from GDELT
        run: |
          python << 'EOF'
          import json, urllib.request, urllib.parse, datetime

          # Rövid, stabil GDELT query
          query = "terror OR terrorist OR bombing OR explosion OR attack"

          url = "https://api.gdeltproject.org/api/v2/geo/geo?" + urllib.parse.urlencode({
              "query": query,
              "mode": "Point",
              "format": "GeoJSON",
              "maxrecords": "250"
          })

          print("URL:", url)

          try:
              response = urllib.request.urlopen(url, timeout=30)
              raw = response.read().decode("utf-8")

              # DEBUG fájl mentés
              with open("gdelt_debug.txt", "w", encoding="utf-8") as f:
                  f.write(raw[:2000])

              data = json.loads(raw)

              incidents = []

              if "features" in data:
                  for item in data["features"]:
                      props = item.get("properties", {})
                      coords = item.get("geometry", {}).get("coordinates", [None, None])

                      if coords and len(coords) == 2:
                          incidents.append({
                              "title": props.get("name", "Conflict event"),
                              "date": props.get("sqlDate", "2025-01-01"),
                              "lat": coords[1],
                              "lon": coords[0],
                              "source": props.get("url", "")
                          })

              print("Parsed events:", len(incidents))

              # fallback ha GDELT nem ad adatot
              if len(incidents) == 0:
                  incidents = [{
                      "title": "Live feed temporary fallback (GDELT)",
                      "date": datetime.date.today().isoformat(),
                      "lat": 30,
                      "lon": 31,
                      "source": ""
                  }]

              with open("incidents.json", "w", encoding="utf-8") as f:
                  json.dump(incidents, f, indent=2)

          except Exception as e:
              print("ERROR:", e)
          EOF

      - name: Commit and push
        run: |
          git config user.name "osint-bot"
          git config user.email "actions@github.com"
          git add incidents.json gdelt_debug.txt
          git commit -m "OSINT update (GDELT live feed)" || echo "No changes"
          git push
