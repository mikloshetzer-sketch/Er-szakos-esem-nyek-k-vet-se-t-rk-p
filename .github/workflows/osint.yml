name: OSINT Live Feed (Named + Geo)

on:
  schedule:
    - cron: "15 6 * * *"   # napi 06:15 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build incidents.json from GDELT GEO 2.1 (named events)
        run: |
          set -e
          python - << 'PY'
          import json, urllib.parse, urllib.request, datetime as dt

          # --- Query: terrorism/attack related keywords ---
          query = '(terror OR terrorist OR bombing OR bomb OR explosion OR shooting OR attack OR assassination OR "car bomb" OR "suicide bombing")'

          params = {
              "query": query,
              "mode": "geo",
              "format": "json",
              "maxrecords": "250",
              "sort": "datedesc"
          }

          url = "https://api.gdeltproject.org/api/v2/geo/geo?" + urllib.parse.urlencode(params)
          raw = urllib.request.urlopen(url, timeout=60).read().decode("utf-8")
          data = json.loads(raw)

          out = []
          seen = set()

          features = data.get("features", []) or []
          for f in features:
              p = (f.get("properties") or {})
              g = (f.get("geometry") or {})
              coords = g.get("coordinates") or [None, None]
              lon, lat = coords[0], coords[1]
              if lat is None or lon is None:
                  continue

              # date normalize: YYYYMMDD... -> YYYY-MM-DD
              raw_date = (p.get("date") or p.get("seendate") or "")
              if raw_date and len(raw_date) >= 8:
                  date = f"{raw_date[0:4]}-{raw_date[4:6]}-{raw_date[6:8]}"
              else:
                  date = dt.datetime.utcnow().strftime("%Y-%m-%d")

              # Only keep from 2025+
              if date[:4].isdigit() and int(date[:4]) < 2025:
                  continue

              source = p.get("url") or "https://www.gdeltproject.org/"
              if source in seen:
                  continue
              seen.add(source)

              # Best-effort naming (GDELT field availability can vary)
              title = (
                  p.get("name")
                  or p.get("title")
                  or p.get("description")
                  or "OSINT incident (GDELT)"
              )

              location = (
                  p.get("location")
                  or p.get("geoname")
                  or p.get("country")
                  or "Unknown"
              )

              # Simple type tag
              t = (str(title) + " " + str(p.get("theme",""))).lower()
              ev_type = "attack"
              if "explos" in t or "bomb" in t:
                  ev_type = "bomb"
              elif "shoot" in t or "gun" in t:
                  ev_type = "shooting"
              elif "riot" in t:
                  ev_type = "riot"
              elif "smuggl" in t or "traffick" in t:
                  ev_type = "smuggling"

              out.append({
                  "id": f"gdelt-{len(out)+1}",
                  "title": str(title)[:180],
                  "type": ev_type,
                  "date": date,
                  "location": location,
                  "lat": float(lat),
                  "lon": float(lon),
                  "source": source
              })

              if len(out) >= 200:
                  break

          # Fallback so the map never goes blank
          if not out:
              out = [{
                  "id":"fallback-001",
                  "title":"OSINT fallback (no fresh results from feed)",
                  "type":"attack",
                  "date":"2025-01-01",
                  "location":"Global",
                  "lat":31.5,
                  "lon":34.75,
                  "source":"https://www.gdeltproject.org/"
              }]

          with open("incidents.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          print("Wrote incidents:", len(out))
          PY

      - name: Commit and push
        run: |
          git config user.name "osint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add incidents.json
          git commit -m "osint: daily gdelt update" || echo "No changes to commit"
          git push
