name: OSINT Live Feed (GDELT SAFE)

on:
  workflow_dispatch:
  schedule:
    # 6 óránként
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: osint-live-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build incidents.json from GDELT DOC 2.1 (SAFE)
        env:
          MAX_PER_YEAR: "1000"
          # Ha kell szűkíteni, itt tedd: pl. "terror OR terrorism OR bombing"
          GDELT_QUERY: '(terror OR terrorism OR "bomb attack" OR bombing OR "suicide attack" OR "mass shooting" OR "gun attack" OR assassination OR IED)'
        run: |
          python - <<'PY'
          import json, os, time, datetime, re
          import requests

          OUT_JSON = "incidents.json"
          DEBUG_TXT = "gdelt_debug.txt"

          MAX_PER_YEAR = int(os.getenv("MAX_PER_YEAR", "1000"))
          QUERY = os.getenv("GDELT_QUERY", '(terror OR terrorism)').strip()

          # Évlista: teljes 2025 + 2026 (YTD, jan is benne)
          YEARS = [2025, 2026]

          # GDELT DOC 2.1 endpoint
          BASE = "https://api.gdeltproject.org/api/v2/doc/doc"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "osint-terror-map/1.0 (github actions)"
          })

          def log(s: str):
              with open(DEBUG_TXT, "a", encoding="utf-8") as f:
                  f.write(s.rstrip() + "\n")

          def safe_json(resp):
              ct = (resp.headers.get("Content-Type") or "").lower()
              text_head = (resp.text or "")[:400].replace("\n","\\n")
              log(f"HTTP {resp.status_code} CT={ct} HEAD={text_head}")
              if resp.status_code != 200:
                  return None
              if "json" not in ct and not resp.text.strip().startswith("{"):
                  return None
              try:
                  return resp.json()
              except Exception as e:
                  log(f"JSON parse error: {e}")
                  return None

          def to_ymd_from_seendate(seen: str):
              # GDELT seendate tipikusan: "20250101000000"
              if not seen:
                  return None
              m = re.match(r"^(\d{4})(\d{2})(\d{2})", seen)
              if not m:
                  return None
              return f"{m.group(1)}-{m.group(2)}-{m.group(3)}"

          def fetch_year(year: int):
              """
              DOC API: startdatetime/enddatetime formátum: YYYYMMDDHHMMSS
              2025: teljes év
              2026: év elejétől mostig (jan is benne)
              """
              if year == 2026:
                  # YTD
                  startdt = "20260101000000"
                  enddt = datetime.datetime.utcnow().strftime("%Y%m%d%H%M%S")
              else:
                  startdt = f"{year}0101000000"
                  enddt   = f"{year}1231235959"

              results = []
              start_record = 1
              page_size = 250  # DOC API max körül

              while len(results) < MAX_PER_YEAR:
                  params = {
                      "query": QUERY,
                      "mode": "ArtList",
                      "format": "json",
                      "startdatetime": startdt,
                      "enddatetime": enddt,
                      "maxrecords": page_size,
                      "startrecord": start_record,
                      "formatdatatype": "json"
                  }

                  url = BASE
                  try:
                      resp = session.get(url, params=params, timeout=30)
                  except Exception as e:
                      log(f"Request error: {e}")
                      break

                  log(f"\n=== YEAR {year} startrecord={start_record} ===")
                  log(f"URL: {resp.url}")
                  data = safe_json(resp)
                  if not data:
                      # Nem JSON / hiba → ne essünk el, csak stop az évre
                      break

                  arts = data.get("articles") or []
                  if not arts:
                      break

                  for a in arts:
                      title = (a.get("title") or "").strip()
                      url = (a.get("url") or "").strip()
                      domain = (a.get("domain") or "").strip()
                      seen = a.get("seendate") or ""
                      date = to_ymd_from_seendate(seen) or f"{year}-01-01"

                      # GEO: DOC cikkeknél sokszor van locations lista
                      loc_name = None
                      lat = None
                      lon = None
                      locs = a.get("locations") or []
                      # próbáljuk az első olyan lokációt, amin van lat/lon
                      for L in locs:
                          if L.get("lat") is not None and L.get("lon") is not None:
                              lat = float(L["lat"])
                              lon = float(L["lon"])
                              loc_name = (L.get("name") or "").strip() or None
                              break

                      # Ha nincs geo, nem tudjuk térképre tenni → kihagyjuk
                      if lat is None or lon is None:
                          continue

                      results.append({
                          "id": a.get("id") or url or f"{year}-{len(results)+1}",
                          "date": date,
                          "year": year,
                          "title": title or "(no title)",
                          "url": url or "",
                          "source": domain or "",
                          "location": loc_name or "",
                          "lat": lat,
                          "lon": lon
                      })

                      if len(results) >= MAX_PER_YEAR:
                          break

                  # lapozás
                  start_record += page_size
                  time.sleep(1.0)

              log(f"YEAR {year} -> kept {len(results)} geocoded records")
              return results

          # Debug fejléc
          open(DEBUG_TXT, "w", encoding="utf-8").write(
              "GDELT DOC SAFE build debug\n"
              f"UTC now: {datetime.datetime.utcnow().isoformat()}Z\n"
              f"Query: {QUERY}\n"
              f"Years attempted: {YEARS}\n\n"
          )

          all_items = []
          for y in YEARS:
              all_items.extend(fetch_year(y))

          # Ha nem találtunk semmit, ne írjuk felül a meglévő incidents.json-t
          if len(all_items) == 0:
              log("\nNO NEW RECORDS. Keeping existing incidents.json unchanged.")
              # azért tegyünk ki egy debug summary-t
              print("No new records from GDELT (or GDELT unavailable).")
              raise SystemExit(0)

          # JSON-safe: garantáltan tiszta UTF-8, vezérlő karakterek nélkül
          out_text = json.dumps(all_items, ensure_ascii=False, indent=2)

          # gyors validáció
          json.loads(out_text)

          with open(OUT_JSON, "w", encoding="utf-8") as f:
              f.write(out_text)

          log(f"\nWROTE incidents.json records={len(all_items)}")
          print(f"Wrote {OUT_JSON} with {len(all_items)} records")
          PY

      - name: Commit & push if changed
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "osint-bot"
            git config user.email "osint-bot@users.noreply.github.com"
            git add incidents.json gdelt_debug.txt
            git commit -m "OSINT update (GDELT SAFE)"
            git push
          else
            echo "No changes to commit."
          fi
