name: OSINT Live Feed (GDELT) - Safe Update

on:
  workflow_dispatch:

  # Ha nem akarod, hogy automatikusan fusson, ezt a 2 sort kommenteld ki
  schedule:
    - cron: "0 * * * *"   # óránként (UTC)

permissions:
  contents: write

concurrency:
  group: osint-live-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build incidents.json from GDELT DOC API (best-effort)
        env:
          # Ha van GDELT API key-ed / tokened, ide teheted később
          # GDELT_API_KEY: ${{ secrets.GDELT_API_KEY }}
          TZ: UTC
        run: |
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, datetime

          NOW = datetime.datetime.utcnow()
          years = [NOW.year-1, NOW.year]  # pl. 2025, 2026 (ha most 2026 van)
          query = '(terror OR terrorism OR "bomb attack" OR bombing OR "suicide attack" OR "mass shooting" OR "gun attack" OR assassination OR "IED")'

          # GDELT DOC 2.1 endpoint
          # Megjegyzés: a DOC API a cikkekből jön; nem garantált a koordináta minden rekordnál.
          base = "https://api.gdeltproject.org/api/v2/doc/doc"

          debug_lines = []
          debug_lines.append("GDELT DOC API build debug")
          debug_lines.append(f"UTC now: {NOW.isoformat()}Z")
          debug_lines.append(f"Query: {query}")
          debug_lines.append(f"Years attempted: {years}")

          all_items = []

          def fetch(url: str) -> str:
            req = urllib.request.Request(url, headers={"User-Agent": "osint-bot/1.0"})
            with urllib.request.urlopen(req, timeout=30) as r:
              return r.read().decode("utf-8", errors="replace")

          # próbálunk évenként kérdezni; start/end dátumot adunk, hogy ne csak jan 1 legyen
          for y in years:
            start = f"{y}-01-01"
            end   = f"{y}-12-31"

            params = {
              "query": query,
              "mode": "ArtList",
              "format": "json",
              "startdatetime": f"{y}0101000000",
              "enddatetime": f"{y}1231235959",
              "maxrecords": "250",
              "sort": "datedesc",
              "format": "json"
            }

            url = base + "?" + urllib.parse.urlencode(params)
            debug_lines.append("")
            debug_lines.append(f"URL ({y}): {url}")

            try:
              raw = fetch(url)
            except Exception as e:
              debug_lines.append(f"FETCH ERROR ({y}): {e}")
              continue

            # ha a GDELT nem JSON-t ad vissza (pl. hiba HTML-ben), itt elhasalhat
            try:
              data = json.loads(raw)
            except Exception as e:
              debug_lines.append("JSON parse error:")
              debug_lines.append(str(e))
              debug_lines.append("Response head (first 400 chars):")
              debug_lines.append(raw[:400])
              continue

            arts = data.get("articles", []) or []
            debug_lines.append(f"Articles returned ({y}): {len(arts)}")

            for a in arts:
              # DOC API mezők változhatnak; próbálunk “biztos” mezőket
              title = a.get("title") or a.get("sourceCountry") or "GDELT article"
              url_a = a.get("url") or ""
              seendate = a.get("seendate") or ""
              # seendate tipikusan "YYYYMMDDTHHMMSSZ" vagy "YYYYMMDD..."
              # csinálunk belőle YYYY-MM-DD-t ha lehet:
              date = None
              if isinstance(seendate, str) and len(seendate) >= 8 and seendate[:8].isdigit():
                date = f"{seendate[0:4]}-{seendate[4:6]}-{seendate[6:8]}"
              else:
                date = start

              # koordináta: DOC API-nál sokszor nincs. Megpróbáljuk több kulcsból.
              lat = None
              lon = None

              # néha "socialimage" stb van csak -> nincs koordináta
              # ha van "locations" lista (ritka), abból próbálunk
              locs = a.get("locations")
              if isinstance(locs, list) and locs:
                # első lokáció
                loc0 = locs[0] if isinstance(locs[0], dict) else None
                if loc0:
                  lat = loc0.get("lat")
                  lon = loc0.get("lon")

              # néha "geo" jellegű mezők vannak
              for k_lat, k_lon in [("lat", "lon"), ("latitude", "longitude")]:
                if lat is None and lon is None:
                  if k_lat in a and k_lon in a:
                    lat = a.get(k_lat)
                    lon = a.get(k_lon)

              # csak akkor vesszük fel, ha van lat/lon és szám
              try:
                lat_f = float(lat)
                lon_f = float(lon)
              except Exception:
                continue

              item = {
                "title": title,
                "date": date,
                "lat": lat_f,
                "lon": lon_f,
                "source": "GDELT DOC API",
                "url": url_a
              }
              all_items.append(item)

          debug_lines.append("")
          debug_lines.append(f"Total usable (with coords): {len(all_items)}")

          # duplikációk csökkentése: url vagy (lat,lon,date,title) alapján
          seen = set()
          uniq = []
          for it in all_items:
            key = it.get("url") or (round(it["lat"], 4), round(it["lon"], 4), it["date"], it["title"])
            if key in seen:
              continue
            seen.add(key)
            uniq.append(it)

          # max 1000 (hogy ne legyen brutál nagy)
          uniq = uniq[:1000]

          with open("incidents.json", "w", encoding="utf-8") as f:
            json.dump(uniq, f, ensure_ascii=False, indent=2)

          with open("gdelt_debug.txt", "w", encoding="utf-8") as f:
            f.write("\n".join(debug_lines) + "\n")

          print(f"Wrote incidents.json records: {len(uniq)}")
          PY

      - name: Show incidents.json size
        run: |
          ls -lah incidents.json || true
          head -n 5 incidents.json || true

      # --- A LÉNYEG: NEM ENGEDJÜK, HOGY [] FELÜLÍRJA A JÓ ADATOT ---
      - name: Check incidents.json is non-empty
        id: nonempty
        run: |
          if [ ! -f incidents.json ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "incidents.json missing"
            exit 0
          fi

          # whitespace nélkül nézzük
          CONTENT="$(cat incidents.json | tr -d ' \n\r\t')"
          if [ "$CONTENT" = "[]" ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "incidents.json is empty ([]). Will NOT commit."
          else
            echo "ok=true" >> $GITHUB_OUTPUT
            echo "incidents.json is non-empty. Will commit."
          fi

      - name: Commit and push (only if non-empty)
        if: steps.nonempty.outputs.ok == 'true'
        run: |
          git config user.name "osint-bot"
          git config user.email "actions@github.com"
          git add incidents.json gdelt_debug.txt || true
          git commit -m "OSINT update (GDELT DOC)" || exit 0
          git push
