name: OSINT Live Feed (GDELT FINAL)

on:
  schedule:
    - cron: "13 * * * *"   # óránként (UTC). Ha percesebb kell, átírjuk később.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build incidents.json from GDELT DOC API
        run: |
          python scripts/build_incidents.py

      - name: Commit changes (if any)
        run: |
          git config user.name "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          git add incidents.json gdelt_debug.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "OSINT update (GDELT DOC)"

      - name: Pull (rebase) then push
        run: |
          # Non-fast-forward ellen:
          git pull --rebase origin main
          git push origin main
