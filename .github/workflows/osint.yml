name: OSINT Live Feed (GDELT GEO)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Build incidents.json from GDELT GEO
        run: |
          python << 'PY'
          import requests, json, datetime

          YEARS = ["2025", "2026"]

          QUERY = '"terror attack" OR bombing OR "suicide attack" OR "mass shooting" OR "gun attack" OR assassination OR IED'

          incidents = []

          for year in YEARS:
              url = f"https://api.gdeltproject.org/api/v2/doc/doc?query={QUERY}&mode=ArtList&format=json&maxrecords=250&startdatetime={year}0101000000&enddatetime={year}1231235959"

              try:
                  data = requests.get(url, timeout=30).json()
              except:
                  continue

              articles = data.get("articles", [])

              for a in articles:
                  if not a.get("locations"):
                      continue

                  loc = a["locations"][0]

                  incidents.append({
                      "title": a.get("title"),
                      "date": a.get("seendate"),
                      "url": a.get("url"),
                      "source": a.get("sourcecountry"),
                      "lat": loc.get("lat"),
                      "lon": loc.get("lon")
                  })

          if len(incidents) > 0:
              with open("incidents.json","w",encoding="utf-8") as f:
                  json.dump(incidents,f,ensure_ascii=False)
          PY

      - name: Commit if changed
        run: |
          git config user.name "osint-bot"
          git config user.email "bot@users.noreply.github.com"

          git add incidents.json

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "OSINT auto update (GDELT GEO)"
            git push
          fi
