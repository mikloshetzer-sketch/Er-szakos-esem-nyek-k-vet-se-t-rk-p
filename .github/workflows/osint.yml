name: OSINT Live Feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build incidents.json
        run: |
          python - << 'PY'
          import json, urllib.request, urllib.parse, datetime

          try:
              query = "terror OR bombing OR explosion OR shooting OR attack"
              params = {
                  "query": query,
                  "mode": "geo",
                  "format": "json",
                  "maxrecords": "150",
                  "sort": "datedesc"
              }

              url = "https://api.gdeltproject.org/api/v2/geo/geo?" + urllib.parse.urlencode(params)
              raw = urllib.request.urlopen(url, timeout=60).read().decode("utf-8").strip()

              if raw == "":
                  raise Exception("Empty GDELT response")

              data = json.loads(raw)

              out = []
              for i,f in enumerate(data.get("features", [])[:100]):
                  p = f.get("properties", {})
                  g = f.get("geometry", {})
                  coords = g.get("coordinates", [0,0])

                  lon, lat = coords[0], coords[1]
                  if not lat or not lon:
                      continue

                  rawdate = p.get("date","20250101")
                  date = f"{rawdate[:4]}-{rawdate[4:6]}-{rawdate[6:8]}"

                  out.append({
                      "id": f"live-{i}",
                      "title": p.get("name","Conflict event"),
                      "type": "attack",
                      "date": date,
                      "location": p.get("country","Unknown"),
                      "lat": lat,
                      "lon": lon,
                      "source": p.get("url","https://gdeltproject.org")
                  })

              if len(out) == 0:
                  raise Exception("No parsed events")

          except Exception as e:
              print("GDELT error -> fallback:", e)
              out = [{
                  "id":"fallback",
                  "title":"Live feed temporary fallback",
                  "type":"conflict",
                  "date":datetime.datetime.utcnow().strftime("%Y-%m-%d"),
                  "location":"Global",
                  "lat":31.5,
                  "lon":34.7,
                  "source":"https://gdeltproject.org"
              }]

          with open("incidents.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,ensure_ascii=False)

          print("Events:",len(out))
          PY

      - name: Commit
        run: |
          git config user.name "osint-bot"
          git config user.email "actions@github.com"
          git add incidents.json
          git commit -m "auto live update" || echo "no change"
          git push
